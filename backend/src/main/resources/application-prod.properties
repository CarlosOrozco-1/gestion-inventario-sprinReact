# ============================================================
# Perfil de PRODUCCIÓN: PostgreSQL
# Se activa con: SPRING_PROFILES_ACTIVE=prod (variable de entorno)
# Las credenciales se inyectan por variables de entorno para no
# exponer secretos en el repositorio.
# ============================================================
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/inventario}
spring.datasource.username=${DB_USERNAME:inventario}
spring.datasource.password=${DB_PASSWORD:inventario}
spring.datasource.driver-class-name=org.postgresql.Driver

# Dialecto PostgreSQL explícito (sobreescribe cualquier heredado del perfil base).
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# El esquema lo crea y versiona Flyway; Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate

# Flyway: aplica db/migration/*.sql al arranque.
spring.flyway.enabled=true

# Producción: desactivar el SQL traceado
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
