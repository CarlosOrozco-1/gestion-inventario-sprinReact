# ============================================================
# Configuración base (perfil por defecto): PostgreSQL
# El sistema corre 100% sobre PostgreSQL (Flyway + perfil prod).
# Para local sin Docker: levantar un PostgreSQL en localhost:5432
# con base/usuario/contraseña inventario.
# ============================================================
spring.datasource.url=jdbc:postgresql://localhost:5432/inventario
spring.datasource.username=${DB_USERNAME:inventario}
spring.datasource.password=${DB_PASSWORD:inventario}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.flyway.enabled=true

# Seguridad JWT: el secreto se inyecta por variable de entorno JWT_SECRET
# (ver .env / docker-compose). Sin variable, se usa una clave de desarrollo
# NO recomendada y que solo sirve para local.
jwt.secret=${JWT_SECRET:clave-dev-insegura-no-usar-en-produccion}
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Proyecciones (Fase 10): criterios avanzados de stock según consumo de movimientos
#   stockMinimo sugerido = consumo diario x lead-time (punto de reorden)
#   stockMaximo sugerido = consumo diario x (lead-time + cobertura) (meta de compra)
inventario.proyeccion.ventana-dias=90
inventario.proyeccion.lead-time-dias=7
inventario.proyeccion.dias-cobertura=30

# Correo SMTP (Fase 12): credenciales por variables de entorno (ver .env).
# Gmail requiere "contraseña de aplicación" en spring.mail.password.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.ssl.protocols=TLSv1.2
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
