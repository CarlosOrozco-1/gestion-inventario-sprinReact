services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - JAVA_TOOL_OPTIONS=-Xmx384m
    expose:
      - "8080"
    volumes:
      - ./backend/data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "8081:80"
    restart: unless-stopped
