# ============================================================
# Docker Compose para PRODUCCIÓN: Spring Boot + PostgreSQL
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Las credenciales se cargan del archivo .env (DB_USERNAME,
# DB_PASSWORD, MAIL_USERNAME, MAIL_PASSWORD, JWT_SECRET). Ver .env.example.
#
# DESPLIEGUE: el Caddy central enruta el subdominio DuckDNS hacia
# host.docker.internal:8081 (frontend). El backend queda SOLO interno.
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/inventario
      JWT_SECRET: ${JWT_SECRET}
      TZ: ${TZ:-America/Guatemala}
      JAVA_TOOL_OPTIONS: -Xmx384m -Duser.timezone=${TZ:-America/Guatemala}
    expose:
      - "8080"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: ${DB_USERNAME:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario}
      TZ: ${TZ:-America/Guatemala}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventario} -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  pgdata:
