# ============================================================
# Docker Compose para PRODUCCIÓN: Spring Boot + PostgreSQL
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Las credenciales se pueden sobrescribir con un archivo .env
# o variables de entorno (DB_USERNAME, DB_PASSWORD).
# ============================================================
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://db:5432/inventario
      DB_USERNAME: ${DB_USERNAME:-inventario}
      DB_PASSWORD: ${DB_PASSWORD:-inventario}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: inventario
      POSTGRES_USER: ${DB_USERNAME:-inventario}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-inventario}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-inventario} -d inventario"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
