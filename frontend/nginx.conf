server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: proxya hacia el backend del compose (misma URL de origen, sin CORS)
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # SPA: cualquier ruta cae a index.html (React Router)
    # El index.html NO se cachea (no-cache): siempre se revalida para que la
    # app cargue los assets con hash actuales tras cada despliegue.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Cache de estaticos con hashes (inmutables: el hash cambia con el contenido)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Evita que el fallback SPA sirva index.html como si fuera un asset
    # inexistente (evita pantallas en blanco por URLs huérfanas de viejo build).
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?|ico)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
